<!doctype html>
<html lang="hu">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a0e"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="MegaLife">
<link rel="apple-touch-icon" href="icon.svg"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css">
<title>MegaLife — Life Simulator</title>
</head>
<body>
<div id="app">
<header class="topbar">
  <div class="brand">MEGA<span>LIFE</span><small> LIFE SIMULATOR</small><em class="version-badge">v0.5.4</em></div>
  <div class="top-actions"><button id="refreshBtn" class="icon-btn" onclick="refreshPage()" aria-label="Frissítés">↻</button><button class="profile-btn" onclick="openProfile()" aria-label="Profil">👤</button></div>
</header>

<main id="game" class="shell">
<section id="startScreen" class="start card">
  <div class="hero-icon">∞</div><div class="start-kicker">ÉLET-SZIMULÁTOR</div><h1>MegaLife</h1><p>Éld a saját történeted. Dönts, fejlődj, építs kapcsolatokat és nézd meg, hová jut az életed.</p>
  <div class="form-grid"><label>Keresztnév<input id="firstName" maxlength="20" placeholder="Alex"></label><label>Vezetéknév<input id="lastName" maxlength="20" placeholder="Kovács"></label></div><button type="button" class="setup-toggle" onclick="toggleSetup()">⚙️ További beállítások <span>⌄</span></button><div id="advancedSetup" class="advanced-setup hidden"><label>Nem<select id="gender"><option value="female">Nő</option><option value="male">Férfi</option><option value="nonbinary">Nem bináris</option></select></label><label>Ország<select id="country"><option>Magyarország</option><option>Németország</option><option>USA</option><option>Egyesült Királyság</option><option>Japán</option><option>Kanada</option><option>Ausztrália</option></select></label></div>
  <button id="startBtn" class="primary big">Élet kezdése</button><div id="saveNotice" class="muted"></div>
</section>

<section id="gameScreen" class="hidden">
  <div class="life-hud">
    <section class="profile card">
      <div class="avatar ml-character-avatar" id="avatar" aria-label="A karaktered"></div>
      <div class="profile-main"><h2 id="pName">—</h2><div id="pMeta" class="muted">—</div></div>
      <div class="hud-money"><span>VAGYON</span><b id="wealth">0 Ft</b></div>
    </section>

    <section class="story card">
      <div class="story-head">
        <div class="journal-paper-head" aria-hidden="true"><i></i><i></i><i></i></div>
      </div>
      <div id="lifeLog" class="life-log"></div><div id="returnShortcut" class="return-shortcut-wrap hidden"></div>
      <div id="choiceBanner" class="choice-banner hidden"></div>
    </section>

    <section class="advance-wrap">
      <div class="life-actions left">
        <button class="life-action" onclick="showTab('relations')" aria-label="Kapcsolatok"><span>❤️</span><b>Kapcsolatok</b></button>
        <button class="life-action" onclick="showTab('career')" aria-label="Karrier"><span>💼</span><b>Karrier</b></button>
      </div>
      <button id="ageBtn" class="advance" aria-label="Következő év"><span>+</span><small>KÖVETKEZŐ ÉV</small></button>
      <div class="life-actions right">
        <button class="life-action" onclick="showTab('finance')" aria-label="Pénz"><span>💰</span><b>Pénz</b></button>
        <button class="life-action" onclick="showTab('activities')" aria-label="Több"><span>☰</span><b>Több</b></button>
      </div>
    </section>

    <section class="stats-dock card">
      <div class="dock-title ml-status-label" aria-hidden="true"></div>
      <div id="statBars" class="hud-stats"></div>
    </section>
    <div id="adSlot" class="ad-slot" aria-label="Hirdetési hely" role="region"><span class="ad-slot-label">HIRDETÉSI HELY</span></div>

    <nav class="mobile-nav" aria-label="Főmenü" style="display:none">
      <button class="mobile-nav-item active" onclick="showTab('life')"><span>📖</span><b>Élet</b></button>
      <button class="mobile-nav-item" onclick="showTab('relations')"><span>❤️</span><b>Kapcsolatok</b></button>
      <button class="mobile-nav-item" onclick="showTab('career')"><span>💼</span><b>Karrier</b></button>
      <button class="mobile-nav-item" onclick="showTab('finance')"><span>💰</span><b>Pénz</b></button>
      <button class="mobile-nav-item" onclick="showTab('assets')"><span>🏠</span><b>Vagyon</b></button>
      <button class="mobile-nav-item" onclick="showTab('activities')"><span>☰</span><b>Több</b></button>
    </nav>

    <div id="tab-life" class="legacy-tab hidden"></div><div id="tab-relations" class="legacy-tab hidden"></div><div id="tab-career" class="legacy-tab hidden"></div><div id="tab-finance" class="legacy-tab hidden"></div><div id="tab-assets" class="legacy-tab hidden"></div><div id="tab-activities" class="legacy-tab hidden"></div><div id="tab-achievements" class="legacy-tab hidden"></div><div id="tab-stats" class="legacy-tab hidden"></div><div id="tab-social" class="legacy-tab hidden"></div>
  </div>
</section>
</main>

<div id="modal" class="modal hidden"><div class="modal-box"><div id="modalBody"></div></div></div>
<div id="toast"></div><footer class="app-footer">MegaLife <span id="versionText">v0.5.4</span></footer>
<script src="app.js"></script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",async()=>{try{const r=await navigator.serviceWorker.register("sw.js",{updateViaCache:"none"});await r.update()}catch(e){}})}</script>
<div id="refreshOverlay" class="refresh-overlay hidden" aria-live="polite"><div class="refresh-box"><div class="refresh-spinner"></div><b>Frissítés…</b><small>Az oldal újratöltése folyamatban</small></div></div></body></html>

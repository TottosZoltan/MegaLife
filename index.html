<!doctype html>
<html lang="hu">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a0e"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="MegaLife">
<link rel="apple-touch-icon" href="icon.svg"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css">
<title>MegaLife — Life Simulator</title>
</head>
<body>
<div id="app">
<header class="topbar">
  <div class="brand">MEGA<span>LIFE</span><small> LIFE SIMULATOR</small></div>
  <div class="top-actions"><button id="refreshBtn" class="icon-btn" onclick="refreshPage()">↻</button><button class="ghost" onclick="manageSaves()">💾 Életek</button><button id="saveBtn" class="ghost">Mentés</button><button id="newBtn" class="danger">Új élet</button></div>
</header>

<main id="game" class="shell">
<section id="startScreen" class="start card">
  <div class="hero-icon">∞</div><h1>MegaLife</h1><p>Éld le az életed évről évre. Dönts, kockáztass, keress pénzt, építs kapcsolatokat és viseld a döntéseid következményeit.</p>
  <div class="form-grid"><label>Keresztnév<input id="firstName" maxlength="20" placeholder="Alex"></label><label>Vezetéknév<input id="lastName" maxlength="20" placeholder="Kovács"></label><label>Nem<select id="gender"><option value="female">Nő</option><option value="male">Férfi</option><option value="nonbinary">Nem bináris</option></select></label><label>Ország<select id="country"><option>Magyarország</option><option>Németország</option><option>USA</option><option>Egyesült Királyság</option><option>Japán</option><option>Kanada</option><option>Ausztrália</option></select></label></div>
  <button id="startBtn" class="primary big">Élet kezdése</button><div id="saveNotice" class="muted"></div>
</section>

<section id="gameScreen" class="hidden">
  <div class="life-hud">
    <section class="profile card">
      <div class="avatar" id="avatar">A</div><div class="profile-main"><h2 id="pName">—</h2><div id="pMeta" class="muted">—</div></div>
      <div class="hud-money"><span>VAGYON</span><b id="wealth">0 Ft</b></div>
    </section>

    <section class="story card">
      <div class="story-head"><div><span class="eyebrow">ÉLETNAPLÓ</span><h1 id="ageText">0 éves</h1><span id="yearText" class="muted"></span></div><div class="story-actions"><button class="ghost" onclick="showTab('life')">📖</button><button class="ghost" onclick="showTab('relations')">❤️</button><button class="ghost" onclick="showTab('career')">💼</button><button class="ghost" onclick="showTab('finance')">💰</button><button class="ghost" onclick="showTab('assets')">🏠</button><button class="ghost" onclick="showTab('stats')">📊</button></div></div>
      <div id="lifeLog" class="life-log"></div>
      <div id="choiceBanner" class="choice-banner hidden"></div>
    </section>

    <section class="advance-wrap"><button id="ageBtn" class="advance" aria-label="Következő év"><span>+</span><small>KÖVETKEZŐ ÉV</small></button></section>

    <section class="stats-dock card"><div class="dock-title">ÁLLAPOT</div><div id="statBars" class="hud-stats"></div></section>

    <section class="quick-grid">
      <button class="quick card" onclick="showTab('relations')"><b>❤️</b><span>Kapcsolatok</span><small id="quickRelations">0</small></button>
      <button class="quick card" onclick="showTab('career')"><b>💼</b><span>Karrier</span><small id="quickCareer">—</small></button>
      <button class="quick card" onclick="showTab('finance')"><b>💰</b><span>Pénz</span><small id="quickCash">0 Ft</small></button>
      <button class="quick card" onclick="showTab('assets')"><b>🏠</b><span>Vagyon</span><small id="quickAssets">0</small></button>
    </section>

    <div id="tab-life" class="legacy-tab hidden"></div><div id="tab-relations" class="legacy-tab hidden"></div><div id="tab-career" class="legacy-tab hidden"></div><div id="tab-finance" class="legacy-tab hidden"></div><div id="tab-assets" class="legacy-tab hidden"></div><div id="tab-activities" class="legacy-tab hidden"></div><div id="tab-achievements" class="legacy-tab hidden"></div><div id="tab-stats" class="legacy-tab hidden"></div>
  </div>
</section>
</main>

<div id="modal" class="modal hidden"><div class="modal-box"><button id="modalClose" class="modal-close">×</button><div id="modalBody"></div></div></div>
<div id="toast"></div><footer class="app-footer">MegaLife <span id="versionText">v0.0.14</span></footer>
<script src="app.js"></script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",async()=>{try{const r=await navigator.serviceWorker.register("sw.js",{updateViaCache:"none"});await r.update()}catch(e){}})}</script>
</body></html>
